# Alerts are visible in Prometheus and Alertmanager, but this demo has no
# external Slack/email receiver until an operator supplies credentials.
# Do not silently point notifications at an invented URL.
route:
  receiver: default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
