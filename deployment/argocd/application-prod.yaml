apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: job-market-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/skrutikov/german-job-market-analytics.git
    # ONLY the approved promotion workflow advances this branch.
    targetRevision: production
    path: deployment/kubernetes/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
