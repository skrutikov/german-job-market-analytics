apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: job-market-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/skrutikov/german-job-market-analytics.git
    targetRevision: main
    path: deployment/kubernetes/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
