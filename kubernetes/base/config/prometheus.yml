global:
  scrape_interval: 15s
  evaluation_interval: 1m  # default

rule_files:
  - /etc/prometheus/alerts.yml  # path inside the Prometheus (Docker) container

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"
  - job_name: "job-market-backend"
    static_configs:
      - targets:
          - "backend:8000"
  - job_name: "job-market-etl"
    static_configs:
      - targets:
          - "pushgateway:9091"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"  # Docker service name and Alertmanager's internal listening port
