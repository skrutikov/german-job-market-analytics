global:
  scrape_interval: 15s
  evaluation_interval: 1m  # default

rule_files:
  - /etc/prometheus/alerts.yml  # path inside the Prometheus (Docker) container

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"
  - job_name: "job-market-backend"
    metrics_path: /metrics/
    static_configs:
      - targets:
          - "backend:8000"
  # Container CPU/memory scraped through the authenticated Kubernetes API proxy.
  - job_name: "kubernetes-cadvisor"
    scheme: https
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
  - job_name: "kube-state-metrics"
    static_configs:
      - targets:
          - "kube-state-metrics:8080"
  - job_name: "job-market-etl"
    static_configs:
      - targets:
          - "pushgateway:9091"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"  # Docker service name and Alertmanager's internal listening port
