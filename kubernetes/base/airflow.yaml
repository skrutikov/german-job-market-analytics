apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-state
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: etl-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: airflow
  template:
    metadata:
      labels:
        app: airflow
    spec:
      securityContext:
        runAsUser: 50000
        runAsGroup: 0
        fsGroup: 0
      containers:
        - name: airflow
          image: ghcr.io/skrutikov/german-job-market-analytics-airflow:dev
          command: [airflow, standalone]
          envFrom:
            - configMapRef:
                name: job-market-settings
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: job-market-secrets
                  key: DATABASE_URL
            - name: AIRFLOW_HOME
              value: /opt/airflow/state
            - name: AIRFLOW__CORE__DAGS_FOLDER
              value: /opt/airflow/dags
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: state
              mountPath: /opt/airflow/state
            - name: data
              mountPath: /opt/airflow/data
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
            limits:
              memory: 3Gi
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: airflow-state
        - name: data
          persistentVolumeClaim:
            claimName: etl-data
---
apiVersion: v1
kind: Service
metadata:
  name: airflow
spec:
  selector:
    app: airflow
  ports:
    - name: http
      port: 8080
      targetPort: 8080
