apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - ../../base
  - ingress.yaml
  - cadvisor-rbac.yaml
images:
  # Both dev and prod use images built from the security-scanned main branch.
  # "dev" names the Kubernetes namespace, not a moving CI image tag.
  - name: ghcr.io/skrutikov/german-job-market-analytics
    newTag: main
  - name: ghcr.io/skrutikov/german-job-market-analytics-airflow
    newTag: main
