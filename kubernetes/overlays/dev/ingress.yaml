apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: job-market
spec:
  ingressClassName: traefik
  rules:
    - host: job-market-dev.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
