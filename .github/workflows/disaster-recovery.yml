name: Disaster recovery smoke test

on:
  push:
    branches: [disaster-recovery]
    paths:
      - "deployment/dr/**"
      - "deployment/scripts/create_backup.sh"
      - "deployment/scripts/restore_backup.sh"
      - ".github/workflows/disaster-recovery.yml"
  pull_request:
    branches: [main]
    paths:
      - "deployment/dr/**"
      - "deployment/scripts/create_backup.sh"
      - "deployment/scripts/restore_backup.sh"
      - ".github/workflows/disaster-recovery.yml"
  workflow_dispatch:

jobs:
  postgres-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n deployment/scripts/deploy.sh deployment/scripts/destroy.sh deployment/scripts/restore_backup.sh deployment/dr/common.sh deployment/scripts/create_backup.sh deployment/dr/restore.sh deployment/dr/maintenance.sh deployment/dr/verify_backup.sh deployment/dr/finalize_backup.sh deployment/dr/sanitize_overlay.sh deployment/dr/test_local_path.sh deployment/dr/test_verify_args.sh deployment/dr/test_restore_target.sh deployment/dr/test_restore_cli.sh deployment/dr/test_offline_finalize.sh
      - name: Check validated k3s local-path PVC lookup
        run: bash deployment/dr/test_local_path.sh
      - name: Test backup verifier arguments
        run: bash deployment/dr/test_verify_args.sh
      - name: Test restore destination identity safety guard
        run: bash deployment/dr/test_restore_target.sh
      - name: Test automated backup metadata recording
        run: python3 -m unittest discover -s deployment/dr -p 'test_*.py' -v
      - name: Check root restore CLI refuses wrong Terraform state and node
        run: bash deployment/dr/test_restore_cli.sh
      - name: Validate DR root CLI safety guards
        run: |
          if bash deployment/scripts/restore_backup.sh 100 >/tmp/dr-guard.txt 2>&1; then
            echo "VM 100 must never be a DR target" >&2
            exit 1
          fi
          grep -F "Refusing recovery into VM 100" /tmp/dr-guard.txt
          if bash deployment/scripts/deploy.sh not-a-vm >/dev/null 2>&1; then
            echo "deployment/scripts/deploy.sh accepted an invalid VM ID" >&2
            exit 1
          fi
          if bash deployment/scripts/destroy.sh not-a-vm >/dev/null 2>&1; then
            echo "deployment/scripts/destroy.sh accepted an invalid VM ID" >&2
            exit 1
          fi
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0
      - name: Verify safe recovery Kustomize rendering
        run: |
          set -euo pipefail
          python3 -m pip install PyYAML==6.0.2
          mkdir -p /tmp/job-market-dr-render
          cp -R kubernetes /tmp/job-market-dr-render/
          overlay=/tmp/job-market-dr-render/deployment/kubernetes/overlays/prod/kustomization.yaml
          tag="$(awk '/newTag: sha-/ { print $2; exit }' "$overlay")"
          bash deployment/dr/sanitize_overlay.sh "$overlay" "$tag"
          kubectl kustomize /tmp/job-market-dr-render/deployment/kubernetes/overlays/prod > /tmp/dr-recovered.yaml
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          docs = [x for x in yaml.safe_load_all(Path("/tmp/dr-recovered.yaml").read_text()) if x]
          find = lambda kind, name: next(x for x in docs if x["kind"] == kind and x["metadata"]["name"] == name)
          assert find("Deployment", "airflow")["spec"]["replicas"] == 0
          assert find("Deployment", "alertmanager")["spec"]["replicas"] == 0
          assert find("CronJob", "data-update")["spec"]["suspend"] is True
          assert find("Deployment", "backend")["spec"]["replicas"] == 1
          assert find("Deployment", "grafana")["spec"]["replicas"] == 1
          assert all(x["metadata"].get("namespace") == "prod" for x in docs if x["kind"] == "Deployment")
          print("Recovered Kustomize resources preserve prod namespace; Airflow/alerts/ETL disabled")
          PY
      - name: PostgreSQL 17 dump and clean restore roundtrip
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name dr-test -e POSTGRES_USER=job_market -e POSTGRES_DB=job_market -e POSTGRES_PASSWORD=test-only postgres:17
          trap 'docker rm -f dr-test >/dev/null 2>&1 || true' EXIT
          for i in {1..60}; do
            if docker exec dr-test pg_isready -U job_market >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec dr-test psql -U job_market -d job_market -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE dr_probe (id integer PRIMARY KEY, label text); INSERT INTO dr_probe VALUES (1, 'yesterday');"
          docker exec dr-test pg_dump -U job_market -d job_market -Fc --no-owner --no-privileges > /tmp/dr-test.dump
          test -s /tmp/dr-test.dump
          docker exec -i dr-test pg_restore --list < /tmp/dr-test.dump >/dev/null
          docker exec dr-test psql -U job_market -d job_market -v ON_ERROR_STOP=1 -c \
            "UPDATE dr_probe SET label='today';"
          docker exec -i dr-test pg_restore -U job_market -d job_market \
            --clean --if-exists --no-owner --no-privileges --exit-on-error --single-transaction \
            < /tmp/dr-test.dump
          actual="$(docker exec dr-test psql -U job_market -d job_market -Atqc 'SELECT label FROM dr_probe WHERE id=1')"
          test "$actual" = yesterday
          echo "PostgreSQL backup/restore roundtrip passed"
      - name: Offline encrypted backup finalization integration test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
          # A tiny dump fits inside a pipe buffer and cannot reproduce an
          # early-closing pg_restore --list causing age to receive SIGPIPE.
          # The previous workflow step removes its own dr-test container.
          # Start a fresh isolated fixture in this step.
          docker run -d --name dr-test-large \
            -e POSTGRES_USER=job_market -e POSTGRES_DB=job_market \
            -e POSTGRES_PASSWORD=test-only postgres:17
          trap 'docker rm -f dr-test-large >/dev/null 2>&1 || true' EXIT
          for i in {1..60}; do
            if docker exec dr-test-large pg_isready -U job_market >/dev/null 2>&1; then break; fi
            sleep 1
          done
          # Build a >1 MiB real custom-format dump for regression coverage.
          docker exec dr-test-large psql -U job_market -d job_market -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE dr_payload (id integer PRIMARY KEY, payload text);
             INSERT INTO dr_payload
             SELECT i, md5(i::text) || md5((i+100000)::text)
             FROM generate_series(1, 100000) AS i;"
          docker exec dr-test-large pg_dump -U job_market -d job_market -Fc \
            --no-owner --no-privileges > /tmp/dr-large.dump
          test "$(stat -c %s /tmp/dr-large.dump)" -gt 1048576
          bash deployment/dr/test_offline_finalize.sh /tmp/dr-large.dump
