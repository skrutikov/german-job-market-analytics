name: Disaster recovery smoke test

on:
  push:
    branches: [disaster-recovery]
    paths:
      - "dr/**"
      - ".github/workflows/disaster-recovery.yml"
  pull_request:
    branches: [main]
    paths:
      - "dr/**"
      - ".github/workflows/disaster-recovery.yml"
  workflow_dispatch:

jobs:
  postgres-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n dr/common.sh dr/backup.sh dr/restore.sh dr/maintenance.sh dr/verify_backup.sh dr/finalize_backup.sh dr/test_local_path.sh dr/test_verify_args.sh dr/test_offline_finalize.sh
      - name: Check validated k3s local-path PVC lookup
        run: bash dr/test_local_path.sh
      - name: Test backup verifier arguments
        run: bash dr/test_verify_args.sh
      - name: Test automated backup metadata recording
        run: python3 -m unittest discover -s dr -p 'test_*.py' -v
      - name: PostgreSQL 17 dump and clean restore roundtrip
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name dr-test -e POSTGRES_USER=job_market -e POSTGRES_DB=job_market -e POSTGRES_PASSWORD=test-only postgres:17
          trap 'docker rm -f dr-test >/dev/null 2>&1 || true' EXIT
          for i in {1..60}; do
            if docker exec dr-test pg_isready -U job_market >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec dr-test psql -U job_market -d job_market -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE dr_probe (id integer PRIMARY KEY, label text); INSERT INTO dr_probe VALUES (1, 'yesterday');"
          docker exec dr-test pg_dump -U job_market -d job_market -Fc --no-owner --no-privileges > /tmp/dr-test.dump
          test -s /tmp/dr-test.dump
          docker exec -i dr-test pg_restore --list < /tmp/dr-test.dump >/dev/null
          docker exec dr-test psql -U job_market -d job_market -v ON_ERROR_STOP=1 -c \
            "UPDATE dr_probe SET label='today';"
          docker exec -i dr-test pg_restore -U job_market -d job_market \
            --clean --if-exists --no-owner --no-privileges --exit-on-error --single-transaction \
            < /tmp/dr-test.dump
          actual="$(docker exec dr-test psql -U job_market -d job_market -Atqc 'SELECT label FROM dr_probe WHERE id=1')"
          test "$actual" = yesterday
          echo "PostgreSQL backup/restore roundtrip passed"
      - name: Offline encrypted backup finalization integration test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
          # A tiny dump fits inside a pipe buffer and cannot reproduce an
          # early-closing pg_restore --list causing age to receive SIGPIPE.
          # The previous workflow step removes its own dr-test container.
          # Start a fresh isolated fixture in this step.
          docker run -d --name dr-test-large \
            -e POSTGRES_USER=job_market -e POSTGRES_DB=job_market \
            -e POSTGRES_PASSWORD=test-only postgres:17
          trap 'docker rm -f dr-test-large >/dev/null 2>&1 || true' EXIT
          for i in {1..60}; do
            if docker exec dr-test-large pg_isready -U job_market >/dev/null 2>&1; then break; fi
            sleep 1
          done
          # Build a >1 MiB real custom-format dump for regression coverage.
          docker exec dr-test-large psql -U job_market -d job_market -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE dr_payload (id integer PRIMARY KEY, payload text);
             INSERT INTO dr_payload
             SELECT i, md5(i::text) || md5((i+100000)::text)
             FROM generate_series(1, 100000) AS i;"
          docker exec dr-test-large pg_dump -U job_market -d job_market -Fc \
            --no-owner --no-privileges > /tmp/dr-large.dump
          test "$(stat -c %s /tmp/dr-large.dump)" -gt 1048576
          bash dr/test_offline_finalize.sh /tmp/dr-large.dump
