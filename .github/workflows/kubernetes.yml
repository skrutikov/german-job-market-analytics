name: Kubernetes manifests and images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, kubernetes-deployment]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Kubernetes access script syntax
        run: bash -n kubernetes_start.sh kubernetes_stop.sh
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate rendered Kustomize overlays
        run: |
          python -m pip install PyYAML==6.0.2
          for environment in dev prod; do
            kubectl kustomize "kubernetes/overlays/$environment" > "/tmp/job-market-$environment.yaml"
            python kubernetes/validate.py "/tmp/job-market-$environment.yaml" "$environment"
          done

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Choose image tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "name=main" >> "$GITHUB_OUTPUT"
          else
            echo "name=dev" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.name }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Publish Airflow image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: airflow/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-airflow:${{ steps.tag.outputs.name }}
            ghcr.io/${{ github.repository }}-airflow:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
