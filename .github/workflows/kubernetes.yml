name: Kubernetes manifests and images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, trivy-scanning]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell and k6 JavaScript syntax
        run: |
          bash -n setup_vm.sh init_airflow.sh kubernetes_start.sh kubernetes_stop.sh argocd/bootstrap.sh argocd/bootstrap-prod.sh argocd/configure-sync.sh
          node --input-type=module --check < performance/k6/job-search.js
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Validate dev and prod Argo CD Applications
        run: |
          python - <<'PY'
          import yaml
          for environment, branch in (("dev", "main"), ("prod", "production")):
              with open(f"argocd/application-{environment}.yaml", encoding="utf-8") as stream:
                  app = yaml.safe_load(stream)
              assert app["kind"] == "Application"
              assert app["metadata"]["name"] == f"job-market-{environment}"
              assert app["metadata"]["namespace"] == "argocd"
              assert app["spec"]["source"]["path"] == f"kubernetes/overlays/{environment}"
              assert app["spec"]["source"]["targetRevision"] == branch
              assert app["spec"]["destination"]["namespace"] == environment
              assert app["spec"]["syncPolicy"]["automated"]["prune"] is True
              assert app["spec"]["syncPolicy"]["automated"]["allowEmpty"] is False
              assert "PruneLast=true" in app["spec"]["syncPolicy"]["syncOptions"]
          PY
      - name: Test immutable release tag update
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate Grafana performance dashboard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          dashboard = json.loads(Path("kubernetes/base/config/performance-dashboard.json").read_text())
          assert dashboard["uid"] == "job-market-performance"
          assert len(dashboard["panels"]) >= 8
          assert len({panel["id"] for panel in dashboard["panels"]}) == len(dashboard["panels"])
          assert all(panel["targets"] for panel in dashboard["panels"])
          PY
      - name: Validate Prometheus and Alertmanager rules
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/kubernetes:/work:ro" prom/prometheus:v3.6.0 \
            check rules /work/base/config/alerts.yml
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/kubernetes:/work:ro" -w /work/tests prom/prometheus:v3.6.0 \
            test rules slo-alerts.test.yml
          docker run --rm --entrypoint /bin/amtool \
            -v "$PWD/kubernetes/base/config:/config:ro" prom/alertmanager:v0.28.1 \
            check-config /config/alertmanager.yml
      - name: Validate SLO Grafana dashboard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          dashboard = json.loads(Path("kubernetes/base/config/slo-dashboard.json").read_text())
          assert dashboard["uid"] == "job-market-slos"
          assert len(dashboard["panels"]) == 8
          assert len({panel["id"] for panel in dashboard["panels"]}) == 8
          assert all(panel["targets"] for panel in dashboard["panels"])
          PY
      - name: Validate security workflow
        run: python security/validate_workflow.py
      - name: Validate rendered Kustomize overlays
        run: |
          for environment in dev prod; do
            kubectl kustomize "kubernetes/overlays/$environment" > "/tmp/job-market-$environment.yaml"
            python kubernetes/validate.py "/tmp/job-market-$environment.yaml" "$environment"
          done

  security:
    # Scan the exact source ref before releasing images to GHCR.
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: validate
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/trivy.yml

  publish:
    # Monitoring-only branches need CI, not overwriting the dev image tag.
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: [validate, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Choose image tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "name=main" >> "$GITHUB_OUTPUT"
          else
            echo "name=dev" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.name }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Publish Airflow image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: airflow/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-airflow:${{ steps.tag.outputs.name }}
            ghcr.io/${{ github.repository }}-airflow:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  update_dev_gitops:
    # A successful, security-scanned publish is the ONLY trigger for a dev release.
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: job-market-dev-gitops
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin published immutable images in dev Kustomize overlay
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -m pip install PyYAML==6.0.2
          git fetch origin main
          # Never deploy an older build after newer code has reached main.
          if [[ "$(git rev-parse origin/main)" != "$RELEASE_SHA" ]]; then
            echo "Main moved since publication. Newer publish will update dev; skipping stale release."
            exit 0
          fi
          python scripts/release_images.py set-dev "$RELEASE_SHA"
          kubectl kustomize kubernetes/overlays/dev > /tmp/job-market-dev.yaml
          python kubernetes/validate.py /tmp/job-market-dev.yaml dev
          git add kubernetes/overlays/dev/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Dev already pins this exact published release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(gitops): deploy sha-$RELEASE_SHA to dev [skip ci]"
          # GitHub's built-in token does not trigger another workflow for this push.
          # Argo CD polls main and sees the manifest change independently.
          git push origin HEAD:main
