user  nginx;  # OS user who handles requests.
worker_processes  auto;  # Number of Nginx workers to run.

error_log  /var/log/nginx/error.log notice;  # Log notice messages and everything more severe.
pid        /var/run/nginx.pid;  # File containing the Nginx master process PID.

events {  # Settings for the event-processing system.
    worker_connections 1024;  # Number of connections per worker.
}

http {  # Configuration for HTTP/HTTPS handling.
    include /etc/nginx/mime.types;  # Load mappings from file extensions to HTTP media types (e.g. ".png" -> "image/png").
    default_type  application/octet-stream;  # If Nginx cannot determine the type, treat the content as generic binary data.

    # Define format "main".
    # Example: "Client 172.18.0.1 requested GET /api/health, Nginx responded with HTTP 200, and sent 15 bytes."
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;  # Log incoming HTTP requests to this file, using the format "main".

    keepalive_timeout 65;  # Keep an idle client connection open for reuse for up to 65 seconds.
    server_tokens off;  # Hide the exact Nginx version from clients.

    # Define a rate-limiting zone to protect against excessive API requests (like spammers or bots).
    # Identify clients by their IP address ($binary_remote_addr).
    # Call the zone "api_per_ip" and reserve 10 MB for storing its state.
    # Allow an average rate of 20 requests/second per IP address.
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;

    upstream frontend {  # Upstream group for frontend traffic.
        server frontend:8050;  # Docker service "frontend" on its internal port.
    }

    upstream backend {  # Upstream group for backend traffic.
        server backend:8000;  # Docker service "backend" on its internal port.
    }

    server {  # Virtual HTTP server acting as the application's reverse proxy.
        listen 80;  # Listen for incoming HTTP connections on port 80.
        server_name _;  # We don’t have a domain name and don’t need hostname-based routing.

        client_max_body_size 1m;  # Reject request bodies larger than 1 MB.

        add_header X-Content-Type-Options "nosniff" always;  # Trust the declared Content-Type; don’t try to guess a different type from the contents.
        add_header X-Frame-Options "SAMEORIGIN" always;  # The site may be embedded in an <iframe> only by pages from the same origin.
        # Control how much of the current URL is sent as referrer information:
        # same origin       ->  send the full URL
        # different origin  ->  send only the origin
        # HTTPS -> HTTP     ->  send no referrer
        # "always" adds the header to error responses as well as successful responses.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /nginx-health {  # Handle only the exact path "/nginx-health".
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = /api {  # Handle only the exact path "/api".
            return 301 /api/;  # Redirect to "/api/".
        }

        location /api/ {  # Handle all paths starting with "/api/" (e.g. /api/docs, /api/health).
            limit_req zone=api_per_ip burst=40 nodelay;  # Apply the rate limit, allowing bursts of up to 40 excess requests without delay.

            proxy_pass http://backend/;  # Forward requests to the backend upstream; trailing "/" replaces the matched "/api/" prefix with "/".
            proxy_http_version 1.1;  # Use HTTP/1.1 between Nginx and the backend.

            proxy_set_header Host $host;  # Pass the client's original hostname to the backend.
            proxy_set_header X-Real-IP $remote_addr;  # Pass the client's IP address to the backend.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Pass the chain of client/proxy IP addresses to the backend.
            proxy_set_header X-Forwarded-Proto $scheme;  # Tell the backend whether the original request used HTTP or HTTPS.
            proxy_set_header X-Forwarded-Prefix /api;  # Tell the backend that it is externally exposed under the "/api" prefix.
        }

        location / {
            proxy_pass http://frontend;  # Forward requests to the frontend upstream.
            proxy_http_version 1.1;  # Use HTTP/1.1 between Nginx and the frontend.

            proxy_set_header Host $host;  # Pass the client's original hostname to the frontend.
            proxy_set_header X-Real-IP $remote_addr;  # Pass the client's IP address to the frontend.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Pass the chain of client/proxy IP addresses to the frontend.
            proxy_set_header X-Forwarded-Proto $scheme;  # Tell the frontend whether the original request used HTTP or HTTPS.
        }
    }
}
